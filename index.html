<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PokéGuess | Quem é esse Pokémon?</title>

    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <main class="app">

        <section class="start-screen" id="startScreen">
            <div class="logo-area">
                <span class="badge">Pokédex Challenge</span>
                <h1>PokéGuess</h1>
                <p>Descubra quem é o Pokémon escondido na silhueta!</p>
            </div>

            <button id="btnSound" class="btn sound-btn">
                🔊 Ativar Som
            </button>

            <button id="btnStart" class="btn primary">
                Jogar agora
            </button>
        </section>

        <section class="game-screen hidden" id="gameScreen">

            <header class="game-header">
                <div>
                    <span class="small-label">Pontuação</span>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <span class="small-label">Rodada</span>
                    <strong id="round">1</strong>
                </div>
            </header>

            <section class="pokemon-card">

                <div class="scanner"></div>
                <div class="mode-area">
                    <label for="pokemonMode">Modo:</label>

                    <select id="pokemonMode">
                        <option value="151">Kanto — 151 Pokémon</option>
                        <option value="251">Johto — até 251</option>
                        <option value="386">Hoenn — até 386</option>
                        <option value="493">Sinnoh — até 493</option>
                        <option value="649">Unova — até 649</option>
                        <option value="721">Kalos — até 721</option>
                        <option value="809">Alola — até 809</option>
                        <option value="905">Galar/Hisui — até 905</option>
                        <option value="1025">Todas — até 1025</option>
                    </select>
                </div>
                <div class="timer-area">
                    <label for="gameTime">Tempo:</label>

                    <select id="gameTime">
                        <option value="0">Sem limite</option>
                        <option value="30">30 segundos</option>
                        <option value="60">1 minuto</option>
                        <option value="120">2 minutos</option>
                        <option value="180">3 minutos</option>
                    </select>

                    <span id="timerDisplay">∞</span>
                </div>
                <div class="pokemon-image-area">
                    <img id="pokemonImage" class="pokemon-img hidden-pokemon" src="" alt="Silhueta do Pokémon" />
                </div>

                <h2 id="pokemonName">Quem é esse Pokémon?</h2>

                <p id="message" class="message">
                    Observe a silhueta e tente acertar!
                </p>

                <label class="assist-toggle">
                    <input type="checkbox" id="assistMode" checked />
                    Ativar ajuda com múltipla escolha
                </label>

                <div class="answer-area" id="answerArea">
                    <input type="text" id="answerInput" placeholder="Digite o nome do Pokémon" autocomplete="off" />

                    <button id="btnAnswer" class="btn secondary">
                        Responder
                    </button>
                </div>

                <div class="options-grid hidden" id="optionsGrid"></div>

                <button id="btnNext" class="btn primary hidden">
                    Próximo Pokémon
                </button>

            </section>

        </section>

    </main>

</body>

</html>
