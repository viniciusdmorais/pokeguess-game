<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PokéGuess | Quem é esse Pokémon?</title>

    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <main class="app">

        <section class="start-screen" id="startScreen">
            <div class="logo-area">
                <span class="badge">Pokédex Challenge</span>
                <h1>PokéGuess</h1>
                <p>Descubra quem é o Pokémon escondido na silhueta!</p>
            </div>

            <div class="start-config-panel">

                <div class="config-group">
                    <label for="gameTime">Tempo de desafio</label>
                    <select id="gameTime">
                        <option value="0">Sem limite</option>
                        <option value="30">30 segundos</option>
                        <option value="60">1 minuto</option>
                        <option value="120">2 minutos</option>
                        <option value="180">3 minutos</option>
                    </select>
                </div>

                <div class="config-group">
                    <label for="pokemonMode">Gerações</label>
                    <select id="pokemonMode">
                        <option value="151">Kanto — 151</option>
                        <option value="251">Até Johto — 251</option>
                        <option value="386">Até Hoenn — 386</option>
                        <option value="493">Até Sinnoh — 493</option>
                        <option value="649">Até Unova — 649</option>
                        <option value="721">Até Kalos — 721</option>
                        <option value="809">Até Alola — 809</option>
                        <option value="905">Até Galar/Hisui — 905</option>
                        <option value="1025">Todas — 1025</option>
                    </select>
                </div>

                <label class="setting-check">
                    <input type="checkbox" id="assistMode" checked />
                    Múltipla escolha
                </label>

                <label class="setting-check">
                    <input type="checkbox" id="hardMode" />
                    Modo difícil nas opções
                </label>

                <label class="setting-check">
                    <input type="checkbox" id="autocompleteMode" checked />
                    Sugestões ao digitar
                </label>

            </div>

            <button id="btnSound" class="btn sound-btn">
                🔊 Ativar Som
            </button>

            <button id="btnStart" class="btn primary">
                Jogar agora
            </button>
        </section>

        <section class="game-screen hidden" id="gameScreen">

            <header class="game-header">
                <div>
                    <span class="small-label">Pontuação</span>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <span class="small-label">Rodada</span>
                    <strong id="round">1</strong>
                </div>

                <div>
                    <span class="small-label">Tempo</span>
                    <strong id="timerDisplay">∞</strong>
                </div>
            </header>

            <div class="top-actions">
                <button id="btnMute" class="icon-btn">🔊 Som</button>
            </div>

            <section class="pokemon-card">

                <div class="scanner"></div>
                <div class="pokemon-image-area">
                    <img id="pokemonImage" class="pokemon-img hidden-pokemon" src="" alt="Silhueta do Pokémon" />
                </div>

                <h2 id="pokemonName">Quem é esse Pokémon?</h2>

                <p id="message" class="message">
                    Observe a silhueta e tente acertar!
                </p>

                <div class="answer-area" id="answerArea">
                    <input type="text" id="answerInput" placeholder="Digite o nome do Pokémon" autocomplete="off" />

                    <div id="suggestions" class="suggestions hidden"></div>

                    <button id="btnAnswer" class="btn secondary">
                        Responder
                    </button>
                </div>

                <div class="options-grid hidden" id="optionsGrid"></div>

                <button id="btnNext" class="btn primary hidden">
                    Próximo Pokémon
                </button>

            </section>

        </section>

    </main>

</body>

</html>
